<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名画里的中国</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap">
<style>
  /* 布局：上方题签，左侧地图、右侧按朝代排的名画列表；点进画卷后全屏展开手卷 */
  :root {
    --paper: #edf0ec;       /* 冷调的石色底 */
    --panel: #f8f9f6;
    --ink: #1c2626;
    --ink-soft: #57625f;
    --line: #cdd5d0;
    --cinnabar: #b13a2a;    /* 朱砂，用于印章和标注 */
    --on-cinnabar: #fff8f2;
    --azurite: #2c6b74;     /* 石青，用于次要强调 */
    --land: #dde4de;
    --land-edge: #b3c0b9;
    --font-display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", "STSong", serif;
    --font-body: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111716; --panel: #182120; --ink: #e4e8e3; --ink-soft: #9ba7a3; --line: #2c3836;
      --cinnabar: #e0654f; --on-cinnabar: #1a0d0a; --azurite: #6db3b9; --land: #1f2b29; --land-edge: #3d4e4a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #111716; --panel: #182120; --ink: #e4e8e3; --ink-soft: #9ba7a3; --line: #2c3836;
    --cinnabar: #e0654f; --on-cinnabar: #1a0d0a; --azurite: #6db3b9; --land: #1f2b29; --land-edge: #3d4e4a;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.7;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--azurite); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
    padding-block: 14px 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line);
  }
  .top h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: 0.08em; line-height: 1.2; }
  .top p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .mapwrap { position: relative; min-height: 0; min-width: 0; }
  #map { position: absolute; inset: 0; }
  .eras {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 12px;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .era-chip {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 999px;
    padding: 2px 12px;
    font-size: 13px;
  }
  .era-chip small { color: var(--ink-soft); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .era-chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .era-chip[aria-pressed="true"] small { color: inherit; opacity: 0.7; }

  .side {
    min-height: 0;
    overflow-y: auto;
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  .detail { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  .detail .era { font-size: 13px; letter-spacing: 0.1em; color: var(--azurite); }
  .detail h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.25; text-wrap: balance; }
  .detail dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: 14px; }
  .detail dt { color: var(--ink-soft); }
  .detail dd { margin: 0; }
  .detail .note { margin: 4px 0 0; }
  .detail figure { margin: 4px 0; display: grid; gap: 4px; }
  .detail .thumb {
    width: 100%; max-height: 300px; object-fit: contain;
    border-radius: 4px; border: 1px solid var(--line); background: var(--paper);
    display: block; cursor: zoom-in; padding: 0;
  }
  .detail figcaption { font-size: 12px; color: var(--ink-soft); }
  .detail figcaption a { color: inherit; }
  .detail .noimg { margin: 2px 0; padding: 10px 12px; font-size: 13px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 4px; }
  .detail .basis { font-size: 12px; color: var(--ink-soft); }

  .lightbox {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center; gap: 10px;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgb(10 14 13 / 0.88);
    cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 4px; }
  .lightbox p { margin: 0; color: #e4e8e3; font-size: 14px; text-align: center; }
  .open {
    justify-self: start;
    margin-top: 6px;
    border: 0;
    border-radius: 999px;
    padding: 8px 18px;
    background: var(--cinnabar);
    color: var(--on-cinnabar);
    font-weight: 600;
  }

  .list { list-style: none; margin: 0; padding: 4px 0 16px; }
  .list h3 { margin: 14px 20px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--ink-soft); }
  .item {
    width: 100%;
    display: grid;
    grid-template-columns: 52px 1fr auto;
    align-items: start;
    gap: 2px 10px;
    padding: 6px 20px;
    border: 0;
    background: none;
    text-align: left;
  }
  .item:hover { background: var(--paper); }
  .item[aria-current="true"] { background: var(--paper); box-shadow: inset 3px 0 0 var(--cinnabar); }
  .item .nm { font-family: var(--font-display); font-size: 18px; line-height: 1.3; }
  .item .pl { grid-column: 2 / -1; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .item .mini {
    grid-row: span 2; width: 52px; height: 52px; object-fit: cover;
    border-radius: 3px; border: 1px solid var(--line); background: var(--paper);
  }
  .item .mini.blank { display: grid; place-items: center; font-size: 11px; color: var(--ink-soft); }
  .item .kind { font-size: 12px; color: var(--azurite); align-self: center; }
  .item .ready {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    font-size: 11px;
    border-radius: 3px;
    background: var(--cinnabar);
    color: var(--on-cinnabar);
    vertical-align: 2px;
    font-family: var(--font-body);
  }

  /* ---------- 画卷 ---------- */
  .viewer { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; grid-template-rows: auto 1fr auto; }
  .vbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .vbar h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: 0.06em; }
  .vbar .meta { color: var(--ink-soft); font-size: 13px; }
  .ghost { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 14px; font-size: 14px; }
  .search { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 0; }
  .search input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--paper); }
  .results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 5;
    list-style: none; margin: 0; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-height: 50vh; overflow-y: auto;
  }
  .results button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; }
  .results button:hover, .results button:focus-visible { background: var(--paper); }
  .results small { color: var(--ink-soft); margin-left: 6px; }

  .canvas { position: relative; min-height: 0; }
  #osd { position: absolute; inset: 0; }
  .dot {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--on-cinnabar);
    background: var(--cinnabar);
    color: var(--on-cinnabar);
    font: 600 11px/18px var(--font-body);
    text-align: center;
    box-shadow: 0 1px 4px rgb(0 0 0 / 0.35);
    padding: 0;
    transition: transform 0.15s, opacity 0.15s;
  }
  .dot.dim { opacity: 0.18; }
  .dot.on { transform: scale(1.35); box-shadow: 0 0 0 4px rgb(177 58 42 / 0.35); }
  .card {
    position: absolute;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: 16px;
    z-index: 4;
    width: min(380px, calc(100% - 32px));
    box-sizing: border-box;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgb(0 0 0 / 0.12);
  }
  .card .cat { font-size: 12px; letter-spacing: 0.12em; color: var(--azurite); }
  .card h3 { margin: 2px 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.3; }
  .card p { margin: 0; }
  .card .nav { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--ink-soft); }
  .card .nav span { font-variant-numeric: tabular-nums; }

  .foot {
    display: grid;
    gap: 8px;
    padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 12px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .strip { position: relative; height: 44px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; background: var(--paper); }
  .strip img { position: absolute; top: 0; height: 100%; display: block; }
  .lens { position: absolute; top: 0; bottom: 0; border: 2px solid var(--cinnabar); background: rgb(177 58 42 / 0.12); pointer-events: none; }
  .credit { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .credit a { color: inherit; }

  @media (max-width: 760px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 50% 50%; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    .top h1 { font-size: 24px; }
    .search { flex-basis: 100%; margin-left: 0; order: 3; }
    .card { bottom: 10px; }
    .era-chip { padding: 1px 9px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>名画里的中国</h1>
    <p>把历代名画放回它画的地方。点地图上的印章，或者按朝代挑一幅。</p>
  </header>
  <main class="stage">
    <div class="mapwrap">
      <div id="map" role="img" aria-label="中国地图，标出了每幅名画描绘的地点"></div>
      <div class="eras" id="eras" role="group" aria-label="按朝代筛选"></div>
    </div>
    <aside class="side">
      <section class="detail" id="detail" aria-live="polite"></section>
      <ul class="list" id="list"></ul>
    </aside>
  </main>
</div>

<section class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button class="ghost" id="back" type="button">← 回到地图</button>
    <h2 id="v-title"></h2>
    <span class="meta" id="v-meta"></span>
    <div class="search">
      <input id="q" type="search" autocomplete="off" aria-label="在画里搜索">
      <ul class="results" id="results" hidden></ul>
    </div>
  </div>
  <div class="canvas">
    <div id="osd"></div>
    <article class="card" id="card"></article>
  </div>
  <div class="foot">
    <div class="chips" id="chips"></div>
    <div class="strip" id="strip" title="整卷缩略图，点一下跳到那里"><div class="lens" id="lens"></div></div>
    <p class="credit" id="v-credit"></p>
  </div>
</section>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="查看大图">
  <img id="lb-img" alt="">
  <p id="lb-cap"></p>
</div>

<script src="works.js"></script>

<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<script>
// 时期分组：用来在地图上按朝代筛选
const PERIODS = [
  ["魏晋南北朝", "220–589"],
  ["隋唐", "581–907"],
  ["五代宋辽金", "907–1279"],
  ["元", "1271–1368"],
  ["明", "1368–1644"],
  ["清", "1644–1912"],
  ["近现代", "1912 至今"],
];

// 名画和它描绘的地点，按年代排列。
// basis：地点是怎么来的。不写就是“画中所绘”；“一说”表示说法不一；“画意”“所在地”用于没有具体实景的作品。
const PAINTINGS = [
  // 魏晋南北朝
  { id: "luoshen", name: "洛神赋图", period: "魏晋南北朝", era: "东晋", artist: "顾恺之（传，宋摹本）", kind: "卷轴",
    place: "洛水之滨（今河南洛阳）", lng: 112.45, lat: 34.62, keep: "北京故宫博物院等",
    note: "依曹植《洛神赋》而画，曹植在洛水边与洛神相遇又分别，一个故事在长卷里连续展开。" },
  { id: "kizil", name: "克孜尔石窟壁画", period: "魏晋南北朝", era: "古龟兹国（约3–9世纪）", artist: "佚名", kind: "壁画",
    place: "拜城克孜尔（今新疆阿克苏）", lng: 82.51, lat: 41.78, keep: "克孜尔石窟",
    note: "中国最早的大型石窟群之一。窟顶用菱形格子画满佛本生故事，一格一个故事，青金石的蓝色至今鲜亮。" },
  { id: "jian", name: "集安高句丽古墓壁画", period: "魏晋南北朝", era: "高句丽（约4–6世纪）", artist: "佚名", kind: "壁画",
    place: "集安（今吉林通化）", lng: 126.18, lat: 41.12, keep: "集安高句丽古墓",
    note: "墓室里画着摔跤、狩猎、舞蹈和日月神，是东北地区保存最好的早期壁画。" },
  // 隋唐
  { id: "bunian", name: "步辇图", period: "隋唐", era: "唐", artist: "阎立本", kind: "卷轴",
    place: "长安（今陕西西安）", lng: 108.94, lat: 34.34, keep: "北京故宫博物院",
    note: "唐太宗坐在步辇上，接见来长安迎娶文成公主的吐蕃使者禄东赞。" },
  { id: "guoguo", name: "虢国夫人游春图", period: "隋唐", era: "唐", artist: "张萱（宋摹本）", kind: "卷轴",
    place: "长安（今陕西西安）", lng: 109.08, lat: 34.22, keep: "辽宁省博物馆",
    note: "杨贵妃的姐姐虢国夫人带着随从骑马踏青。画里不画一草一木，春天全靠人物的衣着和神态。" },
  { id: "xingshu", name: "明皇幸蜀图", period: "隋唐", era: "唐", artist: "李昭道（传）", kind: "立轴",
    place: "蜀道（今四川北部）", lng: 105.57, lat: 32.2, keep: "台北故宫博物院",
    note: "安史之乱时唐玄宗避难入蜀，人马行进在险峻的蜀道山间，是青绿山水的早期名作。" },
  { id: "wangchuan", name: "辋川图", period: "隋唐", era: "唐", artist: "王维（原作已佚）", kind: "卷轴",
    place: "辋川别业（今陕西蓝田）", lng: 109.35, lat: 34.07, keep: "",
    note: "王维在终南山下辋川的别墅，二十处景致写成《辋川集》，又画成长卷。原作早已失传，今见多为后人摹本。" },
  { id: "dunhuang", name: "张议潮统军出行图", period: "隋唐", era: "晚唐", artist: "佚名", kind: "壁画",
    place: "敦煌莫高窟第156窟（今甘肃）", lng: 94.8, lat: 40.04, keep: "敦煌莫高窟",
    note: "张议潮收复河西后率军出行，鼓乐、仪仗、骑兵排成长队，是了解唐代仪仗的珍贵图像。" },
  { id: "astana", name: "伏羲女娲图", period: "隋唐", era: "唐", artist: "佚名", kind: "绢画",

  { id: "xiaoxiang", name: "潇湘图", period: "五代宋辽金", era: "五代 · 南唐", artist: "董源", kind: "卷轴",
    place: "潇湘（今湖南湘江一带）", lng: 111.61, lat: 26.42, basis: "一说", keep: "北京故宫博物院",
    note: "董源用点子皴画平缓的山峦和水面，湖上有小舟、岸边有人迎候。画名据说是明代董其昌起的。" },
  { id: "kuanglu", name: "匡庐图", period: "五代宋辽金", era: "五代", artist: "荆浩（传）", kind: "立轴",
    place: "庐山（今江西九江）", lng: 115.9, lat: 29.66, keep: "台北故宫博物院",
    note: "匡庐就是庐山。高峰层叠、飞瀑直下，是北方全景式山水的代表作。" },

const $ = s => document.querySelector(s);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- 地图页 ---------- */
let selected = "qingming";
let activePeriod = "";
let chart;
const visible = () => PAINTINGS.filter(p => !activePeriod || p.period === activePeriod);

function mapOption() {
  const cinnabar = css("--cinnabar"), ink = css("--ink"), panel = css("--panel");
  const narrow = $("#map").clientWidth < 520;
  return {
    animationDurationUpdate: 300,
    geo: {
      map: "china",
      roam: true,
      center: [104.5, 35.5],
      zoom: narrow ? 1.15 : 1.25,
      scaleLimit: { min: 1, max: 10 },
      label: { show: false, emphasis: { show: false } },
      itemStyle: { areaColor: css("--land"), borderColor: css("--land-edge"), borderWidth: 0.8 },
      emphasis: { itemStyle: { areaColor: css("--land") }, label: { show: false } },
      silent: true,
    },
    series: [{
      type: "scatter",
      coordinateSystem: "geo",
      symbol: "rect",
      cursor: "pointer",
      data: visible().map(p => ({
        name: p.name,
        value: [p.lng, p.lat],
        symbolSize: p.id === selected ? 18 : (p.scroll ? 13 : 10),
        itemStyle: { color: cinnabar, borderColor: panel, borderWidth: p.id === selected ? 3 : 1.5 },
        label: {
          // 印章太密，平时只显示选中那幅的名字，鼠标移上去再显示其他的
          show: p.id === selected, position: "right", distance: 6, formatter: "{b}",
          color: ink, fontFamily: "ZCOOL XiaoWei, Noto Serif SC, serif", fontSize: 15,
          backgroundColor: panel, padding: [2, 6], borderRadius: 3,
        },
      })),
      emphasis: {
        label: { show: true, position: "right", formatter: "{b}", color: ink, fontSize: 14,
                 fontFamily: "ZCOOL XiaoWei, Noto Serif SC, serif", backgroundColor: panel, padding: [2, 6], borderRadius: 3 },
      },
    }],
  };
}

function renderEras() {
  const counts = Object.fromEntries(PERIODS.map(([p]) => [p, PAINTINGS.filter(x => x.period === p).length]));
  $("#eras").innerHTML = [["", "全部", PAINTINGS.length], ...PERIODS.map(([p]) => [p, p, counts[p]])]
    .map(([key, label, n]) => `<button class="era-chip" type="button" data-period="${key}" aria-pressed="${key === activePeriod}">${label}<small>${n}</small></button>`)
    .join("");
  $("#eras").querySelectorAll(".era-chip").forEach(b => b.addEventListener("click", () => {
    activePeriod = b.dataset.period;
    renderEras();
    renderList();
    chart.setOption(mapOption(), true);
  }));
}

const WORKS = window.WORK_IMAGES || {};

// 卡片里的图：能展开的画卷用自己的局部图，其他用维基共享资源上授权可用的图
function imageOf(p) {
  if (p.scroll) return { src: p.thumb, credit: "画卷局部，点“展开画卷”看全卷" };
  const w = WORKS[p.id];
  if (!w) return null;
  return { src: w.src, credit: `图像：<a href="${w.page}" target="_blank" rel="noopener">维基共享资源</a> · ${w.license}` };
}

function renderDetail() {
  const p = PAINTINGS.find(x => x.id === selected);
  const place = p.basis ? `${p.place}<span class="basis">（${p.basis}）</span>` : p.place;
  const rows = [["地点", place], ["作者", p.artist], ["形制", p.kind]];
  if (p.keep) rows.push(["收藏", p.keep]);
  const img = imageOf(p);
  const figure = img
    ? `<figure><button class="thumb" type="button" id="zoom" aria-label="查看${p.name}大图"><img class="thumb" src="${img.src}" alt="${p.name}"></button>
        <figcaption>${img.credit}</figcaption></figure>`
    : `<p class="noimg">${p.period === "近现代"
        ? "近现代作品的版权情况各不相同，这里暂时只收录文字介绍，不收录图像。"
        : "暂时没找到授权可以公开使用的图像，欢迎补充。"}</p>`;
  $("#detail").innerHTML = `
    <span class="era">${p.era} · ${p.period}</span>
    <h2>${p.name}</h2>
    ${figure}
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <p class="note">${p.note}</p>
    ${p.scroll ? `<button class="open" id="open" type="button">展开画卷 →</button>` : ""}`;
  if (p.scroll) $("#open").addEventListener("click", () => openViewer(p.scroll));
  $("#zoom")?.addEventListener("click", () => {
    $("#lb-img").src = img.src;
    $("#lb-img").alt = p.name;
    $("#lb-cap").textContent = `${p.name} · ${p.era} · ${p.artist}`;
    $("#lightbox").hidden = false;
  });
}

$("#lightbox").addEventListener("click", () => { $("#lightbox").hidden = true; });

function renderList() {
  const groups = PERIODS.filter(([per]) => !activePeriod || per === activePeriod);
  $("#list").innerHTML = groups.map(([per, years]) => {
    const items = PAINTINGS.filter(p => p.period === per);
    return `<h3>${per} · ${years}</h3>` + items.map(p => `
      <li><button class="item" type="button" data-id="${p.id}" aria-current="${p.id === selected}">
        ${imageOf(p) ? `<img class="mini" src="${imageOf(p).src}" alt="" loading="lazy">` : `<span class="mini blank">无图</span>`}
        <span class="nm">${p.name}${p.scroll ? `<span class="ready">可展开</span>` : ""}</span>
        <span class="kind">${p.kind}</span>
        <span class="pl">${p.era} · ${p.artist} · ${p.place}</span>
      </button></li>`).join("");
  }).join("");
  $("#list").querySelectorAll(".item").forEach(b => b.addEventListener("click", () => select(b.dataset.id, true)));
}

function select(id, fly) {
  selected = id;
  renderDetail();
  renderList();
  chart.setOption(mapOption(), true);
  if (fly) {
    const p = PAINTINGS.find(x => x.id === id);
    chart.setOption({ geo: { center: [p.lng, p.lat], zoom: Math.max(chart.getOption().geo[0].zoom, 2.4) } });
  }
}

function initMap() {
  chart = echarts.init($("#map"));
  chart.setOption(mapOption());
  chart.on("click", e => {
    const p = PAINTINGS.find(x => x.name === e.name);
    if (p) select(p.id, false);
  });
  addEventListener("resize", () => chart.resize());
  // 跟随主题切换重新上色
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => chart.setOption(mapOption(), true));
  new MutationObserver(() => chart.setOption(mapOption(), true))
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  renderEras();
  renderDetail();
  renderList();
}

/* ---------- 画卷页 ---------- */
let viewer, S, current = -1, activeCat = "", dots = new Map();
const tour = () => S.notes.slice().sort((a, b) => b.x - a.x);   // 手卷从右往左看

function toPoint(x, y) { return new OpenSeadragon.Point(x / S.W, y / S.W); }

function openViewer(id) {
  $("#viewer").hidden = false;
  if (S === SCROLLS[id] && viewer) { viewer.forceRedraw(); return; }
  if (viewer) { viewer.destroy(); viewer = null; }
  S = SCROLLS[id];
  current = -1;
  activeCat = "";
  dots = new Map();
  $("#v-title").textContent = S.title;
  $("#v-meta").textContent = S.meta;
  $("#v-credit").innerHTML = S.credit;
  $("#q").value = "";
  $("#q").placeholder = S.placeholder;
  $("#results").hidden = true;
  $("#strip").querySelectorAll("img").forEach(img => img.remove());
  S.parts.forEach(p => {
    const img = document.createElement("img");
    img.src = p.url;
    img.alt = "";
    img.style.left = `${(p.x / S.W) * 100}%`;
    img.style.width = `${(p.w / S.W) * 100}%`;
    $("#strip").prepend(img);
  });
  initViewer();
}

function closeViewer() {
  $("#viewer").hidden = true;
  $("#results").hidden = true;
}

function initViewer() {
  viewer = OpenSeadragon({
    element: $("#osd"),
    showNavigationControl: false,
    visibilityRatio: 1,
    constrainDuringPan: true,
    maxZoomPixelRatio: 2.5,
    gestureSettingsMouse: { clickToZoom: false },
    gestureSettingsTouch: { clickToZoom: false },
    // 先铺低清缩略图，打开后再按段换成高清
    tileSources: S.parts.map(p => ({ tileSource: { type: "image", url: p.url, buildPyramid: false }, x: p.x / S.W, width: p.w / S.W })),
  });
  viewer.addOnceHandler("open", () => {
    S.strips.forEach(s => viewer.addTiledImage({ tileSource: { type: "image", url: s.url }, x: s.x / S.W, width: s.w / S.W }));
    const list = tour();
    list.forEach((a, i) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "dot";
      el.textContent = i + 1;
      el.setAttribute("aria-label", a.title);
      new OpenSeadragon.MouseTracker({ element: el, clickHandler: () => go(i) });
      viewer.addOverlay({ element: el, location: toPoint(a.x, a.y), placement: OpenSeadragon.Placement.CENTER });
      dots.set(a, el);
    });
    home();
    renderCard();
  });
  viewer.addHandler("viewport-change", updateLens);
  renderChips();
}

function home() {
  // 从卷首（右端）开始，高度铺满
  const box = viewer.viewport.getContainerSize();
  const width = Math.min(1, (S.H / S.W) * (box.x / box.y));
  viewer.viewport.fitBounds(new OpenSeadragon.Rect(1 - width, 0, width, S.H / S.W), true);
}

function go(i) {
  const list = tour();
  if (!list.length) return;
  current = (i + list.length) % list.length;
  const a = list[current];
  const r = a.r || 260;
  viewer.viewport.fitBounds(new OpenSeadragon.Rect((a.x - r) / S.W, Math.max(0, a.y - r * 0.62) / S.W, (2 * r) / S.W, (1.24 * r) / S.W));
  dots.forEach((el, b) => el.classList.toggle("on", b === a));
  renderCard();
}

function renderCard() {
  const list = tour();
  const a = list[current];
  $("#card").innerHTML = a ? `
      <span class="cat">${a.cat}</span>
      <h3>${a.title}</h3>
      <p>${a.desc}</p>
      <div class="nav">
        <button class="ghost" type="button" id="prev">← 上一处</button>
        <span>${current + 1} / ${list.length}</span>
        <button class="ghost" type="button" id="next">下一处 →</button>
      </div>` : `
      <span class="cat">怎么看</span>
      <h3>手卷从右往左展开</h3>
      <p>拖动画面往左走，滚轮或双指放大。红点处都标了画里的细节，共 ${list.length} 处。</p>
      <div class="nav"><button class="ghost" type="button" id="next">开始导览 →</button></div>`;
  $("#prev")?.addEventListener("click", () => go(current - 1));
  $("#next").addEventListener("click", () => go(current + 1));
}

function renderChips() {
  const cats = [...new Set(S.notes.map(a => a.cat))];
  const counts = cats.map(c => [c, S.notes.filter(a => a.cat === c).length]);
  $("#chips").innerHTML = [["", S.notes.length], ...counts].map(([c, n]) =>
    `<button class="chip" type="button" data-cat="${c}" aria-pressed="${c === activeCat}">${c || "全部"} ${n}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    activeCat = b.dataset.cat;
    renderChips();
    applyFilter();
  }));
}

function matches(a, q) {
  const text = `${a.title} ${a.desc} ${a.cat} ${(a.tags || []).join(" ")}`;
  return (!activeCat || a.cat === activeCat) && (!q || q.split(/\s+/).every(w => text.includes(w)));
}

function applyFilter() {
  const q = $("#q").value.trim();
  dots.forEach((el, a) => el.classList.toggle("dim", !matches(a, q)));
  const box = $("#results");
  if (!q) { box.hidden = true; return; }
  const list = tour();
  const hits = list.filter(a => matches(a, q));
  box.hidden = false;
  box.innerHTML = hits.length
    ? hits.map(a => `<li><button type="button" data-i="${list.indexOf(a)}">${a.title}<small>${a.cat}</small></button></li>`).join("")
    : `<li><button type="button" disabled>画里没找到“${q}”，换个词试试</button></li>`;
  box.querySelectorAll("button[data-i]").forEach(b => b.addEventListener("click", () => {
    go(Number(b.dataset.i));
    box.hidden = true;
  }));
}

function updateLens() {
  const b = viewer.viewport.getBounds();
  $("#lens").style.left = `${Math.max(0, b.x) * 100}%`;
  $("#lens").style.width = `${Math.min(1, b.width) * 100}%`;
}

$("#strip").addEventListener("click", e => {
  if (!viewer) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  viewer.viewport.panTo(new OpenSeadragon.Point(x, viewer.viewport.getCenter().y));
});
$("#q").addEventListener("input", applyFilter);
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") $("#results button[data-i]")?.click();
  if (e.key === "Escape") { e.target.value = ""; applyFilter(); }
});
$("#back").addEventListener("click", closeViewer);
addEventListener("keydown", e => {
  if ($("#viewer").hidden || e.target.matches("input")) return;
  if (e.key === "ArrowLeft") go(current + 1);   // 往左走就是往后看
  if (e.key === "ArrowRight") go(current - 1);
  if (e.key === "Escape") closeViewer();
});

initMap();
const hash = location.hash.slice(1);
if (SCROLLS[hash]) { select(hash, false); openViewer(hash); }
</script>
